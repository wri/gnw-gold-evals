const BUCKET_INFO = {
  retrieval:   ["Understanding the question", "Did it pick the right place, dataset and time period the user asked about?"],
  analysis:    ["Doing the maths", "Did it fetch real data and compute the right numbers from it?"],

};

function verdictOf(entry, infoOnly) {
  if (entry.error || (entry.judge_errors || []).length) return "error";
  const scored = Object.entries(entry.checks || {})
    .filter(([n, v]) => v !== null && !infoOnly.includes(baseName(n)));
  if (!scored.length) return "uncovered";
  return scored.some(([, v]) => v === 0) ? "fail" : "pass";
}

function flappedChecks(entry) {
  const trials = entry.trials || [];
  if (trials.length < 2) return [];
  return Object.keys(entry.checks || {}).filter(name => {
    const seen = new Set(trials.map(t => t.checks?.[name]));
    return seen.size > 1;
  });

// Re-score a plain checks map (one trial's worth) without entry-level
// error context — good enough for spread-between-repeats estimates.
function checksVerdict(checks, infoOnly) {
  const scored = Object.entries(checks || {})

  if (!scored.length) return "uncovered";
  return scored.some(([, v]) => v === 0) ? "fail" : "pass";

// "± N pts": sample std (n-1) of a rate across repeats, in percentage
// points. Population std would understate instability at 2-3 repeats.
function spreadPts(rates) {
  if (rates.length < 2) return null;
  const mean = rates.reduce((a, b) => a + b, 0) / rates.length;
  const variance =
    rates.reduce((a, r) => a + (r - mean) ** 2, 0) / (rates.length - 1);
  return Math.sqrt(variance) * 100;
}

function trialChecks(entry, k) {
  return entry.trials?.[k]?.checks ?? entry.checks;
}

// Pass-rate spread across repeats: score every question with only trial
// k's results, k times over.
function overallSpread(entries, trials, infoOnly) {
  if (trials < 2 || !entries.some(e => e.trials)) return null;
  const rates = [];
  for (let k = 0; k < trials; k++) {
    const pass = entries.filter(
      e => checksVerdict(trialChecks(e, k), infoOnly) === "pass").length;
    rates.push(pass / entries.length);
  }
  return spreadPts(rates);
}

// Per-bucket dedicated pass-share spread across repeats.
function bucketSpread(entries, trials, infoOnly, dedicatedMap, bucket) {
  if (trials < 2 || !entries.some(e => e.trials)) return null;
  const rates = [];
  for (let k = 0; k < trials; k++) {

    if (evaluated) rates.push(passed / evaluated);
  }
  return rates.length === trials ? spreadPts(rates) : null;
}

const fmtSpread = pts => pts == null ? ""
  : ` <span class="frac">± ${pts < 0.05 ? "0" : pts.toFixed(1)} pts between repeats</span>`;

function trialTally(entry, name) {
  const trials = entry.trials || [];
  if (trials.length < 2) return "";
  const fails = trials.filter(t => t.checks?.[name] === 0).length;

  suggested_datasets_match: ["suggested_datasets"],
  nudge_match: ["nudge_type", "nudge_options"],
  chart_type_match: ["chart_type"], scope_match: ["scope"],
  class_value_match: ["class_values"],
  dashboard_created: ["dashboard_created"],
  dashboard_aoi_match: ["aoi_ids"],
  dashboard_widgets_match: ["dashboard_widgets"],
};

function expectedFor(check, context) {
  if (!context) return "";
  const turnMatch = check.match(/^t(\d+)\./);
  const expected = turnMatch
    ? (context.turns?.[Number(turnMatch[1]) - 1]?.expected || {})
    : (context.expected || {});
  const fields = CHECK_EXPECTED_FIELDS[baseName(check)] || [];
  return fields.map(f => expected[f]).filter(Boolean).join(" → ");
}

function expectedVsMeasured(entry, context, failedNames) {
  const actuals = entry.actuals || {};
  const rows = failedNames.map(name => {
    const want = expectedFor(name, context);
    const got = actuals[name];
    if (!want && !got) return "";
    return `<tr><td class="mono">${esc(baseName(name))}</td>
      <td>${esc(want) || "<i>—</i>"}</td>
      <td>${got != null ? esc(got) : "<i>not recorded this run</i>"}</td></tr>`;
  }).filter(Boolean).join("");
  return rows ? `<table class="evm">
    <tr><th>check</th><th>expected</th><th>measured</th></tr>${rows}</table>` : "";
}

function render(payload) {
  const run = payload.run, infoOnly = payload.info_only || ["date_coverage"];
  const buckets = run.buckets || {};
  const verdicts = buckets.verdicts || {};
  const entries = run.results || [];
  const total = buckets.rows_total ?? entries.length;
  const trials = run.num_trials || 1;
  const latencies = entries.map(e => e.latency_s).filter(v => v != null);
  const avgLat = latencies.length
    ? Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length) : null;
  const flappingRows = trials > 1
    ? entries.filter(e => flappedChecks(e).length).length : null;

  const howScoring = `
    <details class="help"><summary>How scoring works</summary>
      <p>Every question in the test set carries <b>expectations</b> — the
      place it should identify, the dataset it should use, the figure it
      should report, and so on. Each expectation becomes a <b>check</b>
      that either passes ✓ or fails ✕ after the AI answers. Checks with no
      expectation on that question simply don't apply.</p>
      <p>Most checks are <b>exact rules</b> computed by code (is the
      dataset ID the expected one?). A few are graded by a separate
      <b>AI judge</b> (does this paragraph say what we expected?) — those
      are held to stricter stability standards before they count.</p>
      <p>A question <b>passes</b> only if every check that applies to it
      passes. There is no partial credit — this is a smoke test, and the
      question it answers is "did anything break?", not "how good was
      it?". Checks marked <i>diagnostic only</i> are recorded for
      engineers but never affect pass/fail.</p>
      ${trials > 1 ? `<p>This run asked every question <b>${trials}
      times</b>. A check's overall result is the majority across repeats,
      and a question whose results <i>changed between repeats</i> is
      flagged as unstable — instability usually means the AI behaves
      differently on identical input, which matters as much as a failure.
      The small <b>± figures</b> are the spread of that rate when each
      repeat is scored on its own — a large ± means the headline depends
      on which repeat you happened to get.</p>` : ""}
    </details>`;

  const passSpread = overallSpread(entries, trials, infoOnly);
  const tiles = `
    <div class="tiles">
      <div class="tile good"><div class="n">✓ ${pct(verdicts.pass ?? 0, total)}</div>
        <div class="l">passed all checks (${verdicts.pass ?? "?"} of ${total})${
          passSpread != null ? `<br>±${passSpread < 0.05 ? "0" : passSpread.toFixed(1)} pts between repeats` : ""}</div></div>
      <div class="tile bad"><div class="n">✕ ${pct(verdicts.fail ?? 0, total)}</div>
        <div class="l">failed a check (${verdicts.fail ?? "?"} of ${total})</div></div>
      <div class="tile warn"><div class="n">⚠ ${verdicts.error ?? 0}</div>
        <div class="l">errored — a tooling problem, not the AI's answer</div></div>
      <div class="tile mute"><div class="n">○ ${verdicts.uncovered ?? 0}</div>
        <div class="l">had nothing to check (needs expectations added)</div></div>
      ${flappingRows != null ? `
      <div class="tile ${flappingRows ? "warn" : "good"}">
        <div class="n">${flappingRows ? "⚠" : "✓"} ${pct(flappingRows, total)}</div>
        <div class="l">unstable: answered differently between the ${trials} repeats
        (${flappingRows} of ${total})</div></div>` : ""}
      ${avgLat != null ? `<div class="tile"><div class="n">${avgLat}s</div>
        <div class="l">average time to answer</div></div>` : ""}
    </div>
    ${flappingRows ? `<p class="sub">⚠ Instability matters: ${flappingRows}
      question(s) got different results on identical repeats, so a
      single-run pass on those rows is luck, not reliability.</p>` : ""}`;

  const bucketRows = Object.keys(BUCKET_INFO).map(name => {
    const b = buckets[name];
    if (!b) return "";
    const d = b.dedicated || {}, s = b.shared || {};
    const unmeasured = !d.evaluated && !s.evaluated;
    const [label, blurb] = BUCKET_INFO[name];
    const main = unmeasured
      ? `<span class="chip info">not measured yet</span>`
      : `<span class="pctbig">${pct(d.passed, d.evaluated)}</span>${
           fmtSpread(bucketSpread(entries, trials, infoOnly,
                                  payload.dedicated_map || {}, name))}
         <span class="frac">${d.evaluated ? `${d.passed}/${d.evaluated} checks` : "no specific checks"}</span>
         ${d.evaluated ? `<div class="meter" aria-hidden="true">
           <i style="width:${(100 * d.passed / d.evaluated).toFixed(1)}%"></i></div>` : ""}`;
    return `<tr>
      <td><span class="badge">${esc(name)}</span><strong>${label}</strong><br>
        <span class="frac">${blurb}</span></td>
      <td>${main}</td>
      <td class="num">${s.evaluated ? `${pct(s.passed, s.evaluated)}
        <span class="frac">${s.passed}/${s.evaluated}</span>` : "—"}</td>
      <td class="num">${b.rows_covered} of ${total}</td></tr>`;
  }).join("");

  const contexts = payload.cases || {};
  const failing = entries.filter(e => verdictOf(e, infoOnly) === "fail");
  const failingRows = failing.map(e => {
    const context = contexts[e.uid];
    const flapped = new Set(flappedChecks(e));
    const failedNames = Object.entries(e.checks)
      .filter(([, v]) => v === 0).map(([n]) => n);
    const chips = failedNames.map(n => {
        const info = infoOnly.includes(baseName(n));
        return `<span class="chip${info ? " info" : ""}">${esc(n)}${
          info ? " (diagnostic only)" : esc(trialTally(e, n))}</span>`;
      }).join("");
    const unstable = flapped.size
      ? `<span class="chip flaky">unstable across repeats</span>` : "";
    const promptLine = context
      ? `<div class="prompt">“${esc(context.query)}”${
          context.turns ? ` <span class="frac">(+${context.turns.length - 1} follow-up turn(s))</span>` : ""}</div>
         <div class="frac">group: ${esc(context.group)}${
          context.scope ? ` · expected behaviour: ${esc(context.scope)}` : ""}</div>`
      : `<div class="frac">prompt unavailable — case no longer in the store</div>`;
    const evm = expectedVsMeasured(e, context,
      failedNames.filter(n => !infoOnly.includes(baseName(n))));
    const reasons = Object.entries(e.reasons || {})
      .map(([c, r]) => `<div class="reason"><b>${esc(c)}</b>: ${esc(r)}</div>`).join("");
    // Linkify only http(s) URLs; anything else (e.g. javascript:) would be
    // a live link in a report meant to be shared standalone.
    const trace = !e.trace_url ? ""
      : /^https?:\/\//i.test(e.trace_url)
        ? ` · <a href="${esc(e.trace_url)}">full conversation trace</a>`
        : ` · trace: ${esc(e.trace_url)}`;
    return `<tr><td class="mono">${esc(e.id)}</td>
      <td>${promptLine}${chips}${unstable}${evm}${reasons
        ? `<details><summary>why it failed, in the grader's words${trace}</summary>${reasons}</details>`
        : trace}</td></tr>`;
  }).join("");

  const errored = entries.filter(e => verdictOf(e, infoOnly) === "error")
    .map(e => `<tr><td class="mono">${esc(e.id)}</td>
      <td>${esc(e.error || `judge errors: ${(e.judge_errors || []).join(", ")}`)}</td></tr>`)
    .join("");

  document.getElementById("app").innerHTML = `
    <h1>GOLD run report</h1>
    <div class="meta">A pre-release smoke test of the Global Nature Watch AI:
      the same fixed set of questions every release, so a drop means
      something broke.<br>
      Environment <b>${esc(run.environment)}</b> · build ${esc(run.build)}
      · ${trials} repeat(s) per question
      ${run.methodology_note ? `<br>Note for this run: ${esc(run.methodology_note)}` : ""}</div>
    ${howScoring}
    ${tiles}
    <h2>Where problems occur — the five stages of an answer</h2>
    <div class="sub">Each check belongs to a stage, so a failure points at
      what to fix. Percentages are checks passed within that stage.</div>
    <details class="help"><summary>What do the columns mean?</summary>
      <p><b>Specific checks</b> pin a failure to exactly this stage.
      <b>Shared checks</b> are graded questions whose failure could belong
      to either of two stages (e.g. a wrong final figure could be bad
      maths or a bad explanation) — shown separately so the specific
      percentages stay trustworthy.</p>
      <p><b>Questions covered</b> is how many of the ${total} questions
      have at least one check in this stage — a high pass rate over few
      questions is weaker evidence than one over many.</p></details>
    <table>
      <tr><th>stage</th><th>specific checks passed</th>
        <th class="num">shared checks</th><th class="num">questions covered</th></tr>
      ${bucketRows}</table>
    <h2>Questions that failed (${failing.length})</h2>
    <div class="sub">"Failed every time" is a solid signal; "failed some
      repeats" and "unstable" point at inconsistency rather than a fixed
      bug. Diagnostic-only checks are listed but never count.</div>
    <table><tr><th>question</th><th>what failed, and why</th></tr>
      ${failingRows || "<tr><td colspan=2>none 🎉</td></tr>"}</table>
    ${errored ? `<h2>Errored — tooling problems, not AI answers</h2>
      <div class="sub">Fix the test tooling before reading these as
        failures of the AI.</div>
      <table><tr><th>question</th><th>cause</th></tr>${errored}</table>` : ""}
    <footer>Technical details: run <span class="mono">${esc(run.run_id)}</span>
      · question-set version <span class="mono">${esc(run.caseset_version)}</span>
      (results are only comparable between runs with the same version)
      · judge model ${esc(run.judge_model)}
      · diagnostic-only checks: ${infoOnly.map(esc).join(", ") || "none"}
      · generated ${esc(payload.generated || "locally")}.</footer>`;
}

const raw = document.getElementById("run-payload").textContent.trim();
if (raw && !raw.startsWith("__RUN_")) {
  render(JSON.parse(raw));
} else {
  document.getElementById("app").innerHTML =
    `<h1>GOLD run report</h1>
     <div id="drop">Drop a <span class="mono">results/runs/&lt;run_id&gt;.json</span>
       file here to render it.</div>`;
  const zone = document.getElementById("drop");
  zone.addEventListener("dragover", e => e.preventDefault());
  zone.addEventListener("drop", e => {
    e.preventDefault();
    e.dataTransfer.files[0].text().then(t =>
      render({ run: JSON.parse(t), generated: "drag-and-drop" }));
  });
}
</script>
