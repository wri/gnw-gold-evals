turns:
- query: Break down greenhouse gas emissions and removals in Pará, Brazil by vegetation, soil
    and agriculture.
  expected:
    aoi_ids: BRA.14_1
    dataset_id: '12'
    scope: analyse
- query: How does that compare with Amazonas, Brazil?
  expected:
    text: Declines to compare the two areas, saying that only the standard charts are available
      for this dataset
  deltas:
    retain:
    - dataset_id
notes:
  scenario: '2026-09-16: the sequential route to a cross-area comparison (wri/project-zeno#827).
    1-125 covers the guard that exists - pull_data refuses one pull carrying two AOIs - and
    its notes flag the hole this row closes: nothing refuses two single-area pulls one after
    the other, so a comparison can still reach the user a turn at a time. Turn 1 is the 1-123
    prompt, the same starting state as mt-010.'
  design: 'The assertion is on the comparison, not on the pull. The agent may legitimately
    reach turn 2 two ways - decline outright, or show Amazonas its own standard charts and
    decline to compare - and both satisfy the text expectation, because neither narrates a
    difference between the areas. That is why turn 2 pins neither aoi_ids nor scope: the AOI
    is genuinely either-way (BRA.4_1 if Amazonas resolves, BRA.14_1 if the agent declines
    before touching it) and aoi_ids is set equality, not alternatives; and scope reads analyse
    at turn 2 whichever path runs, because turn 1''s statistics persist in the thread. The
    delta keeps the dataset pinned across the turn, so a row that passes cannot have quietly
    changed subject.'
  status_reason: '2026-09-16: not doing on two counts. (1) Same as 1-112..1-117: LGMS is hidden
    unless ff=experimental while gold runs target the default profile. (2) The behaviour is
    unreleased - wri/project-zeno#827 was open at authoring time, and today the agent compares
    the two areas on request. Re-admit with the other LGMS rows once #827 is deployed and
    runs carry --ff experimental; promote to done on a 3-trial ff=experimental pass at this
    uid.'
