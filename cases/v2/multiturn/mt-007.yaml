  finding: '2026-08-04 (run 20260803T222038Z, ff=experimental): the agent has NO stable policy
    for a bare tree cover loss question. T1 applied context_layer=primary_forest and answered
    230,003 ha on 1 of 3 trials, and applied no context layer and answered 885,237/885,238
