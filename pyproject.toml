[project]
name = "gnw-gold-evals"
version = "0.1.0"
description = "GOLD capability smoke-test set for the Global Nature Watch agent: content-addressed case store, results ledger, and (incoming) harness."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
